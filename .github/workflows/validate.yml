name: Validate VitePress

on:
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tutorial-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU regression dependencies
        run: |
          python -m pip install numpy scipy matplotlib pillow scikit-learn
      - name: Check selected tutorial regressions and all Python syntax
        run: python -m unittest discover -s tests -v
        env:
          MPLBACKEND: Agg
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build site without deployment
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Verify generated downloads match canonical sources
        run: |
          git diff --exit-code -- public/code
          test -z "$(git ls-files --others --exclude-standard public/code)"
