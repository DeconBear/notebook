<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430">
  <defs>
    <style>
      .title { font: 700 28px "Microsoft YaHei", "SimHei", sans-serif; fill: #17324d; }
      .label { font: 600 18px "Microsoft YaHei", "SimHei", sans-serif; fill: #17324d; }
      .text { font: 400 15px "Microsoft YaHei", "SimHei", sans-serif; fill: #294861; }
      .small { font: 400 13px "Microsoft YaHei", "SimHei", sans-serif; fill: #45657f; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4d6f8f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="430" fill="#f7fbff"/>
  <text x="40" y="50" class="title">混合量子-经典图像分类流程图</text>

  <rect x="40" y="110" width="180" height="150" rx="18" fill="#d8ecff" stroke="#6ba1d6" stroke-width="2"/>
  <text x="130" y="150" text-anchor="middle" class="label">输入图像</text>
  <text x="130" y="182" text-anchor="middle" class="text">MNIST 16×16</text>
  <text x="130" y="208" text-anchor="middle" class="text">数字 3 / 6</text>
  <text x="130" y="236" text-anchor="middle" class="small">先做归一化与展平</text>

  <rect x="270" y="110" width="200" height="150" rx="18" fill="#e2f7df" stroke="#72b36a" stroke-width="2"/>
  <text x="370" y="150" text-anchor="middle" class="label">经典压缩器</text>
  <text x="370" y="182" text-anchor="middle" class="text">Linear(256 → 64)</text>
  <text x="370" y="208" text-anchor="middle" class="text">Tanh</text>
  <text x="370" y="236" text-anchor="middle" class="small">把高维像素压成低维任务特征</text>

  <rect x="520" y="80" width="220" height="90" rx="18" fill="#fff1d8" stroke="#d8a24f" stroke-width="2"/>
  <text x="630" y="120" text-anchor="middle" class="label">角度头 A</text>
  <text x="630" y="148" text-anchor="middle" class="text">生成 8 个 Ry 角度</text>

  <rect x="520" y="190" width="220" height="90" rx="18" fill="#fff1d8" stroke="#d8a24f" stroke-width="2"/>
  <text x="630" y="230" text-anchor="middle" class="label">角度头 B</text>
  <text x="630" y="258" text-anchor="middle" class="text">生成 8 个 Rz 角度</text>

  <rect x="790" y="85" width="210" height="190" rx="18" fill="#fce2ee" stroke="#c77295" stroke-width="2"/>
  <text x="895" y="125" text-anchor="middle" class="label">自定义量子编码</text>
  <text x="895" y="160" text-anchor="middle" class="text">8 × Ry</text>
  <text x="895" y="190" text-anchor="middle" class="text">7 × CNOT 链</text>
  <text x="895" y="220" text-anchor="middle" class="text">8 × Rz</text>
  <text x="895" y="250" text-anchor="middle" class="small">这是比赛中要重点优化的部分</text>

  <rect x="1050" y="110" width="190" height="150" rx="18" fill="#e6e0ff" stroke="#8d7ad1" stroke-width="2"/>
  <text x="1145" y="150" text-anchor="middle" class="label">固定 HEA</text>
  <text x="1145" y="182" text-anchor="middle" class="text">depth = 2</text>
  <text x="1145" y="208" text-anchor="middle" class="text">Rx / Ry / Rz + CNOT</text>
  <text x="1145" y="236" text-anchor="middle" class="small">题目规定，不能随意换掉</text>

  <rect x="790" y="315" width="210" height="80" rx="18" fill="#d9f5f0" stroke="#58a99a" stroke-width="2"/>
  <text x="895" y="348" text-anchor="middle" class="label">测量</text>
  <text x="895" y="374" text-anchor="middle" class="text">8 个 Z 期望值</text>

  <rect x="1050" y="305" width="190" height="90" rx="18" fill="#ffe2d9" stroke="#d38566" stroke-width="2"/>
  <text x="1145" y="338" text-anchor="middle" class="label">线性分类头</text>
  <text x="1145" y="364" text-anchor="middle" class="text">Linear(8 → 2)</text>
  <text x="1145" y="388" text-anchor="middle" class="small">输出 logits，判定是 3 还是 6</text>

  <line x1="220" y1="185" x2="270" y2="185" stroke="#4d6f8f" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="470" y1="160" x2="520" y2="125" stroke="#4d6f8f" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="470" y1="210" x2="520" y2="235" stroke="#4d6f8f" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="740" y1="125" x2="790" y2="145" stroke="#4d6f8f" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="740" y1="235" x2="790" y2="215" stroke="#4d6f8f" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1000" y1="180" x2="1050" y2="185" stroke="#4d6f8f" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="895" y1="275" x2="895" y2="315" stroke="#4d6f8f" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1000" y1="355" x2="1050" y2="350" stroke="#4d6f8f" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
