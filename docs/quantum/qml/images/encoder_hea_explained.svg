<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style>
      .bg { fill: #f7fbff; }
      .title { font: 700 34px "Microsoft YaHei", "SimHei", sans-serif; fill: #17324d; }
      .subtitle { font: 600 22px "Microsoft YaHei", "SimHei", sans-serif; fill: #2e5b7f; }
      .label { font: 700 20px "Microsoft YaHei", "SimHei", sans-serif; fill: #17324d; }
      .text { font: 500 18px "Microsoft YaHei", "SimHei", sans-serif; fill: #284b63; }
      .small { font: 500 16px "Microsoft YaHei", "SimHei", sans-serif; fill: #5b7992; }
      .boxA { fill: #eef7ff; stroke: #6aa9d8; stroke-width: 2; rx: 18; }
      .boxB { fill: #effaf0; stroke: #78b56f; stroke-width: 2; rx: 18; }
      .boxC { fill: #fff6e7; stroke: #cf9d49; stroke-width: 2; rx: 18; }
      .boxD { fill: #f9eefb; stroke: #b67ed3; stroke-width: 2; rx: 18; }
      .boxE { fill: #fff0f1; stroke: #d37e86; stroke-width: 2; rx: 18; }
      .arrow { stroke: #4c708f; stroke-width: 3; fill: none; marker-end: url(#arrowHead); }
      .wire { stroke: #687d92; stroke-width: 2; }
      .gateY { fill: #dff4df; stroke: #72b36a; stroke-width: 2; rx: 8; }
      .gateZ { fill: #e5f1ff; stroke: #6aa9d8; stroke-width: 2; rx: 8; }
      .gateH { fill: #fff1d8; stroke: #d2a34f; stroke-width: 2; rx: 8; }
      .note { fill: #ffffff; stroke: #c9d8e6; stroke-width: 1.5; rx: 12; }
      .dot { fill: #4c708f; }
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c708f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="980" class="bg"/>
  <text x="48" y="58" class="title">Encoder 与 HEA 示意图：从 16x16 图像到量子分类</text>
  <text x="48" y="92" class="small">对应当前主方案 lean_reupload：256 -> 128 -> 64 -> 两组 8 维角度 -> 8 比特编码 -> 固定 HEA -> 测量 -> 分类</text>

  <rect x="50" y="140" width="250" height="210" class="boxA"/>
  <text x="78" y="185" class="label">1. 输入图像</text>
  <text x="78" y="220" class="text">一张手写数字图像</text>
  <text x="78" y="252" class="text">形状：16 x 16</text>
  <text x="78" y="284" class="text">共 256 个像素值</text>
  <rect x="188" y="205" width="74" height="74" fill="#ffffff" stroke="#6aa9d8" stroke-width="2"/>
  <g stroke="#9fc4e1" stroke-width="1">
    <line x1="202" y1="205" x2="202" y2="279"/>
    <line x1="216" y1="205" x2="216" y2="279"/>
    <line x1="230" y1="205" x2="230" y2="279"/>
    <line x1="244" y1="205" x2="244" y2="279"/>
    <line x1="258" y1="205" x2="258" y2="279"/>
    <line x1="188" y1="219" x2="262" y2="219"/>
    <line x1="188" y1="233" x2="262" y2="233"/>
    <line x1="188" y1="247" x2="262" y2="247"/>
    <line x1="188" y1="261" x2="262" y2="261"/>
  </g>
  <text x="78" y="322" class="small">注意：这里不是扩展，而是二维图像的原始排布</text>

  <rect x="350" y="140" width="270" height="210" class="boxA"/>
  <text x="378" y="185" class="label">2. 展平（Flatten）</text>
  <text x="378" y="220" class="text">16 x 16 -> 256</text>
  <text x="378" y="252" class="text">只是改形状，不增加信息</text>
  <text x="378" y="284" class="text">输出形状：[batch, 256]</text>
  <rect x="392" y="300" width="186" height="20" fill="#ffffff" stroke="#6aa9d8" stroke-width="2" rx="8"/>
  <g fill="#8ab6d8">
    <rect x="398" y="304" width="8" height="12"/>
    <rect x="412" y="304" width="8" height="12"/>
    <rect x="426" y="304" width="8" height="12"/>
    <rect x="440" y="304" width="8" height="12"/>
    <rect x="454" y="304" width="8" height="12"/>
    <rect x="468" y="304" width="8" height="12"/>
    <rect x="482" y="304" width="8" height="12"/>
    <rect x="496" y="304" width="8" height="12"/>
    <rect x="510" y="304" width="8" height="12"/>
    <rect x="524" y="304" width="8" height="12"/>
    <rect x="538" y="304" width="8" height="12"/>
    <rect x="552" y="304" width="8" height="12"/>
  </g>

  <rect x="670" y="120" width="320" height="250" class="boxB"/>
  <text x="698" y="165" class="label">3. Encoder：经典压缩器</text>
  <text x="698" y="200" class="text">第一层：Linear(256, 128) + Tanh</text>
  <text x="698" y="234" class="text">第二层：Linear(128, 64) + Tanh</text>
  <text x="698" y="268" class="text">把原始像素重新组合成更紧凑的任务特征</text>
  <text x="698" y="302" class="text">输出 hidden 形状：[batch, 64]</text>
  <rect x="716" y="322" width="92" height="26" class="note"/>
  <text x="762" y="340" text-anchor="middle" class="small">256</text>
  <line x1="808" y1="335" x2="846" y2="335" class="arrow"/>
  <rect x="852" y="322" width="92" height="26" class="note"/>
  <text x="898" y="340" text-anchor="middle" class="small">128</text>
  <line x1="944" y1="335" x2="982" y2="335" class="arrow"/>
  <rect x="988" y="322" width="92" height="26" class="note"/>
  <text x="1034" y="340" text-anchor="middle" class="small">64</text>
  <text x="698" y="360" class="small">你可以把这一步理解为：先把图片压成“更有判别力的摘要”。</text>

  <rect x="1040" y="120" width="500" height="250" class="boxC"/>
  <text x="1068" y="165" class="label">4. 角度头：把 64 维特征翻译成量子角</text>
  <text x="1068" y="200" class="text">angle_head_y：Linear(64, 8) -> Sigmoid -> x 2π -> 8 个 Ry 角</text>
  <text x="1068" y="234" class="text">angle_head_z：Linear(64, 8) -> Sigmoid -> x 2π -> 8 个 Rz 角</text>
  <text x="1068" y="268" class="text">这里的 8 维不是分类结果，而是 8 个量子比特各自的旋转角</text>
  <rect x="1088" y="300" width="178" height="42" class="note"/>
  <text x="1177" y="325" text-anchor="middle" class="small">theta_y[0..7]</text>
  <rect x="1296" y="300" width="178" height="42" class="note"/>
  <text x="1385" y="325" text-anchor="middle" class="small">theta_z[0..7]</text>
  <text x="1068" y="360" class="small">Sigmoid 的作用：先把输出压到 [0,1]，再映射成 [0, 2π] 范围的稳定角度。</text>

  <line x1="300" y1="245" x2="350" y2="245" class="arrow"/>
  <line x1="620" y1="245" x2="670" y2="245" class="arrow"/>
  <line x1="990" y1="245" x2="1040" y2="245" class="arrow"/>

  <rect x="50" y="430" width="720" height="470" class="boxD"/>
  <text x="78" y="474" class="label">5. Quantum Encoder：真正把角度写进量子线路</text>
  <text x="78" y="510" class="text">主方案 lean_reupload 的编码是：每个量子比特先做 Ry(theta_yi)，再做 Rz(theta_zi)</text>
  <text x="78" y="542" class="text">也就是“经典特征 -> 量子门参数 -> 量子态”</text>

  <text x="96" y="610" class="text">q0</text>
  <text x="96" y="650" class="text">q1</text>
  <text x="96" y="690" class="text">q2</text>
  <text x="96" y="730" class="text">q3</text>
  <text x="96" y="770" class="text">q4</text>
  <text x="96" y="810" class="text">q5</text>
  <text x="96" y="850" class="text">q6</text>
  <text x="96" y="890" class="text">q7</text>

  <line x1="140" y1="604" x2="690" y2="604" class="wire"/>
  <line x1="140" y1="644" x2="690" y2="644" class="wire"/>
  <line x1="140" y1="684" x2="690" y2="684" class="wire"/>
  <line x1="140" y1="724" x2="690" y2="724" class="wire"/>
  <line x1="140" y1="764" x2="690" y2="764" class="wire"/>
  <line x1="140" y1="804" x2="690" y2="804" class="wire"/>
  <line x1="140" y1="844" x2="690" y2="844" class="wire"/>
  <line x1="140" y1="884" x2="690" y2="884" class="wire"/>

  <g>
    <rect x="220" y="586" width="110" height="36" class="gateY"/>
    <rect x="220" y="626" width="110" height="36" class="gateY"/>
    <rect x="220" y="666" width="110" height="36" class="gateY"/>
    <rect x="220" y="706" width="110" height="36" class="gateY"/>
    <rect x="220" y="746" width="110" height="36" class="gateY"/>
    <rect x="220" y="786" width="110" height="36" class="gateY"/>
    <rect x="220" y="826" width="110" height="36" class="gateY"/>
    <rect x="220" y="866" width="110" height="36" class="gateY"/>
    <text x="275" y="609" text-anchor="middle" class="small">Ry(θy0)</text>
    <text x="275" y="649" text-anchor="middle" class="small">Ry(θy1)</text>
    <text x="275" y="689" text-anchor="middle" class="small">Ry(θy2)</text>
    <text x="275" y="729" text-anchor="middle" class="small">Ry(θy3)</text>
    <text x="275" y="769" text-anchor="middle" class="small">Ry(θy4)</text>
    <text x="275" y="809" text-anchor="middle" class="small">Ry(θy5)</text>
    <text x="275" y="849" text-anchor="middle" class="small">Ry(θy6)</text>
    <text x="275" y="889" text-anchor="middle" class="small">Ry(θy7)</text>
  </g>

  <g>
    <rect x="430" y="586" width="110" height="36" class="gateZ"/>
    <rect x="430" y="626" width="110" height="36" class="gateZ"/>
    <rect x="430" y="666" width="110" height="36" class="gateZ"/>
    <rect x="430" y="706" width="110" height="36" class="gateZ"/>
    <rect x="430" y="746" width="110" height="36" class="gateZ"/>
    <rect x="430" y="786" width="110" height="36" class="gateZ"/>
    <rect x="430" y="826" width="110" height="36" class="gateZ"/>
    <rect x="430" y="866" width="110" height="36" class="gateZ"/>
    <text x="485" y="609" text-anchor="middle" class="small">Rz(θz0)</text>
    <text x="485" y="649" text-anchor="middle" class="small">Rz(θz1)</text>
    <text x="485" y="689" text-anchor="middle" class="small">Rz(θz2)</text>
    <text x="485" y="729" text-anchor="middle" class="small">Rz(θz3)</text>
    <text x="485" y="769" text-anchor="middle" class="small">Rz(θz4)</text>
    <text x="485" y="809" text-anchor="middle" class="small">Rz(θz5)</text>
    <text x="485" y="849" text-anchor="middle" class="small">Rz(θz6)</text>
    <text x="485" y="889" text-anchor="middle" class="small">Rz(θz7)</text>
  </g>

  <rect x="562" y="576" width="178" height="80" class="note"/>
  <text x="651" y="605" text-anchor="middle" class="small">这一步就是 Encoder</text>
  <text x="651" y="628" text-anchor="middle" class="small">把图像特征写进量子态</text>

  <rect x="820" y="430" width="720" height="470" class="boxE"/>
  <text x="848" y="474" class="label">6. HEA：Hardware Efficient Ansatz（硬件高效变分线路）</text>
  <text x="848" y="510" class="text">题目固定给定的后端模块，不是我们自由发挥的编码部分</text>
  <text x="848" y="542" class="text">每层做：所有量子比特上的 Rx/Ry/Rz，再加相邻量子比特之间的线性 CNOT 链</text>
  <text x="848" y="574" class="text">当前深度 depth = 2，也就是“这个子结构重复两次”</text>

  <rect x="874" y="608" width="250" height="90" class="gateH"/>
  <text x="999" y="642" text-anchor="middle" class="text">第 1 层单比特旋转</text>
  <text x="999" y="672" text-anchor="middle" class="small">对每个 qubit 做 Rx, Ry, Rz</text>

  <rect x="1160" y="608" width="250" height="90" class="gateH"/>
  <text x="1285" y="642" text-anchor="middle" class="text">第 1 层纠缠</text>
  <text x="1285" y="672" text-anchor="middle" class="small">q0-q1-q2-...-q7 线性 CNOT</text>

  <rect x="874" y="736" width="250" height="90" class="gateH"/>
  <text x="999" y="770" text-anchor="middle" class="text">第 2 层单比特旋转</text>
  <text x="999" y="800" text-anchor="middle" class="small">再次对每个 qubit 做 Rx, Ry, Rz</text>

  <rect x="1160" y="736" width="250" height="90" class="gateH"/>
  <text x="1285" y="770" text-anchor="middle" class="text">第 2 层纠缠</text>
  <text x="1285" y="800" text-anchor="middle" class="small">再次执行线性 CNOT 链</text>

  <line x1="1124" y1="653" x2="1160" y2="653" class="arrow"/>
  <line x1="1410" y1="653" x2="1440" y2="653" class="arrow"/>
  <line x1="999" y1="698" x2="999" y2="736" class="arrow"/>
  <line x1="1124" y1="781" x2="1160" y2="781" class="arrow"/>

  <rect x="1260" y="842" width="230" height="42" class="note"/>
  <text x="1375" y="868" text-anchor="middle" class="small">HEA 的作用：进一步混合与纠缠特征</text>

  <line x1="770" y1="665" x2="820" y2="665" class="arrow"/>

  <rect x="1220" y="120" width="320" height="200" class="note"/>
  <text x="1244" y="156" class="label">7. 测量与分类</text>
  <text x="1244" y="192" class="text">MeasureAll -> 得到 8 维量子特征</text>
  <text x="1244" y="226" class="text">classifier: Linear(8, 2)</text>
  <text x="1244" y="260" class="text">输出两个 logits：更像 3 还是更像 6</text>
  <text x="1244" y="294" class="small">这里才是最终分类输出，不是前面的 8 维角度。</text>

  <rect x="50" y="925" width="1490" height="32" class="note"/>
  <text x="795" y="946" text-anchor="middle" class="small">一句话总结：Encoder 负责“把图片特征翻译成量子门角度并写入量子态”；HEA 负责“在固定结构下进一步旋转、纠缠和变换这些量子特征”。</text>
</svg>
